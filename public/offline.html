<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Hangeul LPK Platform</title>
    <meta
      name="description"
      content="Koneksi internet terputus. Aplikasi berjalan dalam mode offline."
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #0f172a;
        --muted: #64748b;
        --accent: #1e1b4b;
        --border: #e2e8f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1020;
          --fg: #f8fafc;
          --muted: #94a3b8;
          --accent: #c7d2fe;
          --border: #1e293b;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        max-width: 46ch;
        text-align: center;
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        border: 1px solid var(--border);
        color: var(--accent);
      }
      h1 {
        font-size: 1.5rem;
        line-height: 1.3;
        margin: 0 0 8px;
      }
      p {
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.6;
        margin: 0 0 24px;
      }
      button {
        min-height: 44px;
        min-width: 44px;
        padding: 0 20px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--accent);
        color: var(--bg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m2 2 20 20" />
          <path d="M8.5 16.5a5 5 0 0 1 7 0" />
          <path d="M5 12.86a10 10 0 0 1 3-2.06" />
          <path d="M16 10.8a10 10 0 0 1 3 2.05" />
          <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
          <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>
      <h1>Anda sedang offline</h1>
      <p>
        Koneksi internet terputus sehingga halaman ini tidak dapat dimuat. Periksa jaringan Anda,
        lalu coba lagi.
      </p>
      <button type="button" onclick="window.location.reload()">Coba Lagi</button>
    </main>
  </body>
</html>
