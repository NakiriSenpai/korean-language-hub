name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # The SSR worker and the client bundle must come from the SAME build:
      # VITE_* values are inlined at build time, so building twice (or reusing a
      # CI artifact built with different env) would desync client and server.
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
        run: bun run build

      # Nitro's cloudflare-module preset writes the merged deploy config next to
      # the worker entry (dist/server/wrangler.json). Fail loudly here with the
      # actual tree instead of letting wrangler report a bare ENOENT.
      - name: Verify Nitro deploy output
        run: |
          echo "dist/server contents:"
          ls -la dist/server | head -20
          test -f dist/server/index.mjs || { echo "::error::Missing dist/server/index.mjs"; exit 1; }
          test -d dist/client || { echo "::error::Missing dist/client"; exit 1; }
          if [ ! -f dist/server/wrangler.json ]; then
            echo "::error::Nitro did not emit dist/server/wrangler.json"
            find dist -maxdepth 2 -name 'wrangler*' -print
            exit 1
          fi
          cat dist/server/wrangler.json

      # Deploy from dist/server so `wrangler.json` is picked up as the config in
      # the current working directory. Relative paths inside it (main, assets)
      # are resolved against that same directory.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.118.0"
          workingDirectory: dist/server
          command: deploy --config wrangler.json
