name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # The SSR worker and the client bundle must come from the SAME build:
      # VITE_* values are inlined at build time, so building twice (or reusing a
      # CI artifact built with different env) would desync client and server.
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
        run: bun run build

      # Nitro's cloudflare-module preset normally writes the merged deploy config
      # next to the worker entry (dist/server/wrangler.json), but the output root
      # depends on the preset/version (.output/server, .nitro/... are also valid).
      # Print the real tree, then resolve the directory instead of hardcoding it.
      - name: Audit build output
        run: |
          echo "pwd: $(pwd)"
          echo "--- top-level dirs (depth 3) ---"
          find . -maxdepth 3 -type d -not -path './node_modules*' -not -path './.git/*' | sort
          echo "--- candidate artefacts ---"
          find . -maxdepth 4 \
            \( -name 'wrangler.json' -o -name 'wrangler.jsonc' -o -name 'nitro.json' -o -name 'index.mjs' \) \
            -not -path './node_modules/*' -print || true

      - name: Resolve Nitro server output
        run: |
          set -euo pipefail
          CONFIG=""
          for candidate in dist/server/wrangler.json .output/server/wrangler.json \
                           dist/wrangler.json .output/wrangler.json; do
            if [ -f "$candidate" ]; then CONFIG="$candidate"; break; fi
          done
          if [ -z "$CONFIG" ]; then
            CONFIG=$(find . -maxdepth 4 -name 'wrangler.json' -not -path './node_modules/*' \
              -not -path './.wrangler/*' -print -quit || true)
          fi
          if [ -z "$CONFIG" ]; then
            echo "::error::Nitro emitted no wrangler.json — the build did not produce a Worker bundle."
            exit 1
          fi
          SERVER_DIR=$(dirname "$CONFIG")
          echo "Resolved Worker config: $CONFIG (workingDirectory: $SERVER_DIR)"
          ls -la "$SERVER_DIR" | head -20
          test -f "$SERVER_DIR/index.mjs" || { echo "::error::Missing $SERVER_DIR/index.mjs"; exit 1; }
          cat "$CONFIG"
          echo "NITRO_SERVER_DIR=$SERVER_DIR" >> "$GITHUB_ENV"

      # Deploy from the resolved server directory so `wrangler.json` is picked up
      # as the config in the current working directory. Relative paths inside it
      # (main, assets) resolve against that same directory.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.118.0"
          workingDirectory: ${{ env.NITRO_SERVER_DIR }}
          command: deploy --config wrangler.json

